[project]
name = "fraud-spike-detector"
version = "0.1.0"
description = "Defense-only anomaly detection for transaction fraud spikes"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "scikit-learn>=1.5",
    "seaborn>=0.13.2",
    "streamlit>=1.39",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
